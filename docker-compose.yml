services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Mock OIDC IdP that issues Entra-shaped tokens (oid, tid, preferred_username, roles[]).
  # Issuer: http://localhost:8080/<tenant-id>/v2.0 (Entra v2-style path).
  # Persona login page: mock-oidc/login.html (generated from src/platform/auth/personas.ts).
  # Image is distroless (no shell), so readiness is checked from the host: curl localhost:8080/isalive
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./mock-oidc:/config:ro

volumes:
  pgdata:
