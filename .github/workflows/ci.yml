name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mock values only (same as local dev).
      - run: cp .env.example .env

      # Postgres + mock OIDC (Entra-shaped tokens) via the same docker-compose file used locally.
      - name: Start service containers
        run: |
          docker compose up -d --wait postgres
          docker compose up -d mock-oidc
          for i in $(seq 60); do curl -sf http://localhost:8080/isalive && break; sleep 1; done

      - run: npm ci

      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Generated files are committed and up to date
        run: |
          npm run gen
          git diff --exit-code -- mock-oidc/login.html

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
